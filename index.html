<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGSports - 羽毛球商品展示</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        h1 { color: #0066cc; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .card h3 { margin: 10px 0; color: #333; }
    </style>
</head>
<body>
    <h1>🏸 YGSports 羽毛球商品展示</h1>
    <p style="text-align:center;">欢迎浏览 - 点击分类查看更多</p>

    <div class="grid">
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=Yonex+Ax99" alt="球拍">
            <h3>球拍分类</h3>
            <p>Yonex 天斧99、Li-Ning 等高端球拍</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x200?text=羽毛球" alt="羽毛球">
            <h3>羽毛球分类</h3>
            <p>各种速度、品牌羽毛球展示</p>
        </div>
    </div>
</body>
</html>
