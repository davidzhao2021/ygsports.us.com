<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGSports - 羽毛球商品展示</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        h1 { text-align: center; color: #0066cc; margin-bottom: 10px; }
        .section { margin: 40px 0; }
        .section h2 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .photo-stack { position: relative; height: 240px; }
        .photo-stack img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: all 0.4s; border-radius: 8px; }
        .photo-stack img:nth-child(2) { transform: translate(15px, 15px); opacity: 0.9; }
        .photo-stack:hover img:nth-child(2) { transform: translate(0, 0); z-index: 2; }
        .info { padding: 10px 15px; }
        .price { color: #e60000; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>
    <h1>🏸 YGSports 羽毛球商品展示</h1>

    <!-- 羽毛球 -->
    <div class="section">
        <h2>羽毛球</h2>
        <div class="grid">
            <!-- 在这里复制卡片添加15个 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x220?text=羽毛球1" alt="羽毛球">
                <div class="info">
                    <h3>产品名称1</h3>
                    <p class="price">$25</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 球鞋（叠加照片） -->
    <div class="section">
        <h2>球鞋</h2>
        <div class="grid">
            <div class="card">
                <div class="photo-stack">
                    <img src="https://via.placeholder.com/300x240?text=球鞋正面" alt="球鞋">
                    <img src="https://via.placeholder.com/300x240?text=球鞋侧面" alt="球鞋">
                </div>
                <div class="info">
                    <h3>球鞋型号1</h3>
                    <p class="price">$89</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 其他分类类似结构... -->

</body>
</html>
